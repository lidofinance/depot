name: "Prepare depot"
description: "Install Node.js and depot dependencies"

runs:
  using: "composite"
  steps:
    - name: Install Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: depot/package-lock.json

    - name: Install dependencies
      shell: bash
      run: npm ci
      working-directory: depot
