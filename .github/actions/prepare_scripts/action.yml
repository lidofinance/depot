name: "Prepare scripts"
description: "Install Python, Poetry, and scripts dependencies"

runs:
  using: "composite"
  steps:
    - name: Install Poetry
      shell: bash
      run: pipx install poetry==1.8.2

    - name: Set up Python 3.10
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.10"
        cache: poetry

    - name: Install poetry requirements
      shell: bash
      run: poetry install
      working-directory: scripts

    - name: Use pinned official Solidity binaries for legacy Brownie
      shell: bash
      working-directory: scripts
      run: |
        poetry run python - <<'PY'
        from pathlib import Path
        import solcx.install

        path = Path(solcx.install.__file__)
        source = path.read_text()
        old = 'BINARY_DOWNLOAD_BASE = "https://solc-bin.ethereum.org/{}-amd64/{}"'
        # Legacy solcx uses a retired host; pin the official mirror to an immutable commit.
        new = 'BINARY_DOWNLOAD_BASE = "https://raw.githubusercontent.com/argotorg/solc-bin/c04c6cdc827bbdcc7bd65689fa76b63a238b223f/{}-amd64/{}"'
        path.write_text(source.replace(old, new))
        PY

    - name: Install ganache
      shell: bash
      run: yarn install --frozen-lockfile
      working-directory: scripts

    - name: Import network config to connect brownie with local Ganache
      shell: bash
      run: poetry run brownie networks import network-config.yaml True
      working-directory: scripts

    - name: Show system info
      shell: bash
      run: |
        echo "Memory and swap:"
        free -h
        echo
        swapon --show
        echo
        df -h
        echo
        echo "CPU units"
        nproc --all
        echo "Vote type normal"
