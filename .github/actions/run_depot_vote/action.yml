name: "Run depot vote"
description: "Execute omnibus vote on forked hardhat node"

inputs:
  omnibus:
    description: "Name of the omnibus to apply"
    required: true
  rpc-port:
    description: "Port of the local hardhat node"
    required: false
    default: "8545"

runs:
  using: "composite"
  steps:
    - name: Check that the fork is ready
      shell: bash
      run: |
        timeout 120 bash -c '
          until curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}" \
            http://127.0.0.1:${{ inputs.rpc-port }} > /dev/null 2>&1; do
            echo "Waiting for hardhat node to be ready..."
            sleep 2
          done
        '
        echo "Hardhat node is ready"

    - name: Debug hardhat-node logs (if health check failed)
      if: failure()
      shell: bash
      run: docker ps -a && docker logs $(docker ps -aq --filter "ancestor=ghcr.io/lidofinance/hardhat-node:2.26.0") 2>&1 || echo "Could not fetch container logs"

    - name: Run Vote
      shell: bash
      run: npm run omnibus:ci-prepare -- "$OMNIBUS"
      working-directory: depot
      env:
        OMNIBUS: ${{ inputs.omnibus }}
        ETH_LOCAL_RPC_PORT: ${{ inputs.rpc-port }}
