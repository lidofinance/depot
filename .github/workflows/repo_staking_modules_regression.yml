name: Staking Modules tests CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: Staking Modules post-vote regression
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ETH_MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
      GIT_BRANCH_STAKING_MODULES: develop
      DOTENV_CONFIG_PATH: /dev/null

    steps:
      - name: Checkout depot repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: depot
          persist-credentials: false

      - name: Setup depot
        uses: ./depot/.github/actions/prepare_depot

      - name: Pin regression inputs
        working-directory: depot
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdirSync, writeFileSync } from "node:fs";
          const rpcResponse = await fetch(process.env.ETH_MAINNET_RPC_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_getBlockByNumber", params: ["finalized", false] }),
          });
          const { result: block } = await rpcResponse.json();
          if (!rpcResponse.ok || !block?.number || !block.hash) throw new Error("Could not resolve finalized fork block");
          const branch = process.env.GIT_BRANCH_STAKING_MODULES;
          const refResponse = await fetch(`https://api.github.com/repos/lidofinance/staking-modules/git/refs/heads/${branch}`);
          const { object } = await refResponse.json();
          if (!refResponse.ok || !/^[a-f0-9]{40}$/.test(object?.sha ?? "")) throw new Error("Could not resolve staking-modules SHA");
          const forkBlock = BigInt(block.number).toString();
          appendFileSync(process.env.GITHUB_ENV, `FORK_BLOCK=${forkBlock}\nGIT_SHA_STAKING_MODULES=${object.sha}\n`);
          mkdirSync("logs", { recursive: true });
          writeFileSync("logs/staking-modules-inputs.json", JSON.stringify({
            omnibus: "_example_tiny_omnibus", branch, sha: object.sha, forkBlock, forkBlockHash: block.hash,
          }, null, 2) + "\n");
          NODE

      - name: Run CSM and Curated integration tests after the omnibus
        working-directory: depot
        shell: bash
        run: npm run omnibus:multi-test -- _example_tiny_omnibus --repo staking-modules --fork-block "$FORK_BLOCK" 2>&1 | tee logs/staking-modules-multi-test.log

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: staking-modules-regression
          path: |
            depot/logs/staking-modules-inputs.json
            depot/logs/staking-modules-multi-test.log
            depot/logs/lido-staking-modules.log
            depot/logs/lido-staking-modules-1.log
