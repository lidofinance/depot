name: Checks and Linters

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    # transitive @master refs inside lidofinance/linters stay unpinned upstream
    uses: lidofinance/linters/.github/workflows/security.yml@ff208ca0bf93063c25becac743e1c4eb96d0aad9 # master 2026-05-29
    with:
      languages: "javascript-typescript,actions"
    permissions:
      security-events: write
      contents: read

  formatting:
    name: Check code formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1

      - name: Check formatting with prettier
        run: npm run prettier:check

      - name: Check Solidity formatting with forge fmt
        run: npm run fmt:sol:check

      - name: Lint with ESLint
        run: npm run lint

      - name: Check types with tsc
        run: npm run types
