name: Scripts tests CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests-1:
    name: Scripts fork tests 1/2
    runs-on: ubuntu-latest
    timeout-minutes: 100

    services:
      hardhat-node:
        image: ghcr.io/lidofinance/hardhat-node:2.26.0
        ports:
          - 8545:8545
        env:
          ETH_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          HARDFORK: cancun

    steps:
      - name: Checkout depot repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: depot

      - name: Setup depot
        uses: ./depot/.github/actions/prepare_depot

      - name: Checkout scripts repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: scripts
          repository: lidofinance/scripts
          persist-credentials: false

      - name: Prepare scripts
        uses: ./depot/.github/actions/prepare_scripts

      - name: Run vote
        uses: ./depot/.github/actions/run_depot_vote

      - name: Run script tests 1/2
        run: make test-1/2
        working-directory: scripts
        env:
          ETHERSCAN_TOKEN: ${{ secrets.ETHERSCAN_TOKEN }}
          ETH_RPC_URL: http://127.0.0.1:8545

  run-tests-2:
    name: Scripts fork tests 2/2
    runs-on: ubuntu-latest
    timeout-minutes: 100

    services:
      hardhat-node:
        image: ghcr.io/lidofinance/hardhat-node:2.26.0
        ports:
          - 8546:8545
        env:
          ETH_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          HARDFORK: cancun

    steps:
      - name: Checkout depot repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: depot

      - name: Setup depot
        uses: ./depot/.github/actions/prepare_depot

      - name: Checkout scripts repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: scripts
          repository: lidofinance/scripts
          persist-credentials: false

      - name: Prepare scripts
        uses: ./depot/.github/actions/prepare_scripts

      - name: Run vote
        uses: ./depot/.github/actions/run_depot_vote

      - name: Run script tests 2/2
        run: make test-2/2
        working-directory: scripts
        env:
          ETHERSCAN_TOKEN: ${{ secrets.ETHERSCAN_TOKEN }}
          ETH_RPC_URL: http://127.0.0.1:8546
